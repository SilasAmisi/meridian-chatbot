# Syncs the default branch to a Hugging Face Space whenever `main` is updated.
# Secrets: HF_TOKEN (write token), HF_SPACE_REPO (e.g. your-user/your-space).
# Uses HTTPS git push with URL-encoded credentials (no huggingface-cli / hf).

name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Opt into Node.js 24 for JavaScript actions (GitHub deprecation of Node 20).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: huggingface-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          python3 <<'PY'
          import os
          import subprocess
          import sys
          import urllib.parse

          token = os.environ.get("HF_TOKEN", "").strip()
          repo = os.environ.get("HF_SPACE_REPO", "").strip().strip("/")
          if not token or not repo or "/" not in repo:
              print("::error::Set secrets HF_TOKEN and HF_SPACE_REPO (format: owner/space-name).")
              sys.exit(1)
          user, _, space = repo.partition("/")
          if not user or not space:
              print("::error::HF_SPACE_REPO must be owner/space-name (example: swawire/meridian-chatbot).")
              sys.exit(1)

          quser = urllib.parse.quote(user, safe="")
          qtoken = urllib.parse.quote(token, safe="")
          url = f"https://{quser}:{qtoken}@huggingface.co/spaces/{repo}.git"

          subprocess.run(["git", "remote", "remove", "space"], capture_output=True, text=True)
          subprocess.run(["git", "remote", "add", "space", url], check=True)
          subprocess.run(
              ["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"],
              check=True,
          )
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)

          env = os.environ.copy()
          env["GIT_TERMINAL_PROMPT"] = "0"
          subprocess.run(
              ["git", "push", "--force", "space", "HEAD:main"],
              check=True,
              env=env,
          )
          PY
