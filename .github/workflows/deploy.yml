name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: huggingface-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          set -euo pipefail
          HF_USERNAME=$(echo "$HF_SPACE_REPO" | cut -d'/' -f1)
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git remote remove space 2>/dev/null || true
          git remote add space https://$${HF_USERNAME}:$${HF_TOKEN}@huggingface.co/spaces/$${HF_SPACE_REPO}.git
          # Token is already in the remote URL — disable credential helpers so Git does not
          # invoke huggingface-cli/hf (preinstalled on ubuntu-latest) when talking to huggingface.co.
          unset GIT_ASKPASS || true
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= push --force space HEAD:main 2>&1
